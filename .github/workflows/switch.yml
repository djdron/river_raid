# Builds the game as a Nintendo Switch homebrew (port/switch) with devkitPro, without the ROM:
# whether it compiles and links. The .nro is kept as the run's artifact (the ROM is not in it).
name: Switch build

on:
  push:
    paths:
      - 'port/**'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: CMake
        run: command -v cmake || (apt-get update && apt-get install -y cmake)
      - name: Configure
        run: cmake -S port -B build-switch -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-switch --target river_raid -j4
      - uses: actions/upload-artifact@v4
        with:
          name: river_raid-switch
          path: build-switch/river_raid.nro
