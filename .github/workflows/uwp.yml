# Builds the game as a UWP app (port/uwp) on Windows, without the ROM: whether it compiles
# and packages. It is not run anywhere.
name: UWP build

on:
  push:
    paths:
      - 'port/**'
      - '.github/workflows/uwp.yml'
  workflow_dispatch:

jobs:
  uwp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S port -B build-uwp -A x64 -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0
      - name: Build
        run: cmake --build build-uwp --config Release --target river_raid -- /m
